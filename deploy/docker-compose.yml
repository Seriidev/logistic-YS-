name: yuusell-website

services:
  website:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: yuusell-website
    restart: unless-stopped
    ports:
      - '127.0.0.1:${APP_PORT:-4030}:${APP_PORT:-4030}'
    environment:
      PORT: ${APP_PORT:-4030}
